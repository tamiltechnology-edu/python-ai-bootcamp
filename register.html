<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Closed | Tamil Technology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(236, 72, 153, 0.05) 0px, transparent 50%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      margin: 0;
    }

    .closed-container {
      max-width: 540px;
      width: 100%;
      background: var(--white);
      border-radius: 32px;
      padding: 60px 48px;
      box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.1);
      text-align: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.05);
      opacity: 0;
      transform: translateY(20px);
    }

    .closed-container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 8px;
      background: linear-gradient(90deg, #94a3b8, #cbd5e1);
    }

    .brand-header {
      margin-bottom: 32px;
    }

    .status-icon {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 32px;
      border: 4px solid #ffffff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 16px;
      letter-spacing: -0.03em;
    }

    .message-text {
      font-size: 1.05rem;
      color: var(--gray);
      line-height: 1.6;
      margin-bottom: 40px;
    }

    .waitlist-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 40px;
      text-align: left;
    }

    .waitlist-box h4 {
      font-size: 1rem;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .waitlist-box p {
      font-size: 0.85rem;
      color: #3b82f6;
      line-height: 1.5;
    }

    .btn-professional {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--dark);
      color: var(--white);
      padding: 16px 32px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
      text-decoration: none;
      width: 100%;
    }

    .btn-professional:hover {
      background: #000;
      transform: translateY(-3px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.15);
    }
  </style>
</head>
<body>

  <div class="closed-container" id="mainContainer">
    <div class="brand-header">
      <img src="assets/logo.png" alt="Tamil Technology" style="height: 32px; margin-bottom: 8px;">
    </div>

    <div class="status-icon">
      <i class="fas fa-lock"></i>
    </div>
    
    <h1>Registration Closed</h1>
    
    <p class="message-text">
      Thank you for your overwhelming response! The seats for the <strong>Build Your First AI Assistant with Python</strong> bootcamp are currently full.
    </p>

    <div class="waitlist-box">
      <h4>Missed out?</h4>
      <p>Don't worry! Keep an eye on our YouTube channel for announcements regarding the next batch.</p>
    </div>
    
    <a href="index.html" class="btn-professional">
      <i class="fas fa-arrow-left"></i> Return to Homepage
    </a>
  </div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      gsap.to('#mainContainer', { opacity: 1, y: 0, duration: 0.8, ease: "power4.out" });
    });
  </script>
</body>
</html>
